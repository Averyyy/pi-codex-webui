packages:
  - apps/*
  - packages/*
  - webui-extensions/builtin/*
  - webui-extensions/examples/*

injectWorkspacePackages: true

allowBuilds:
  '@google/genai': true
  esbuild: true
  node-pty: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - tsx@4.23.1
  - '@averyyy/pi-agent-core@0.85.1-piclient.2'
  - '@averyyy/pi-ai@0.85.1-piclient.2'
  - '@averyyy/pi-coding-agent@0.85.1-piclient.2'
  - '@averyyy/pi-tui@0.85.1-piclient.2'

patchedDependencies:
  next-themes@0.4.6: patches/next-themes@0.4.6.patch
