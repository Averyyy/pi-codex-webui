packages:
  - apps/*
  - packages/*
  - webui-extensions/builtin/*
  - webui-extensions/examples/*

injectWorkspacePackages: true

allowBuilds:
  '@google/genai': true
  esbuild: true
  node-pty: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - tsx@4.23.1

patchedDependencies:
  next-themes@0.4.6: patches/next-themes@0.4.6.patch
