packages:
  - apps/*
  - packages/*
  - webui-extensions/builtin/*
  - webui-extensions/examples/*

injectWorkspacePackages: true

allowBuilds:
  '@google/genai': true
  esbuild: true
  node-pty: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - tsx@4.23.1
  - '@averyyy/pi-agent-core@0.80.6-piclient.7'
  - '@averyyy/pi-ai@0.80.6-piclient.7'
  - '@averyyy/pi-coding-agent@0.80.6-piclient.7'
  - '@averyyy/pi-tui@0.80.6-piclient.7'

patchedDependencies:
  '@averyyy/pi-tui@0.80.6-piclient.7': patches/@averyyy__pi-tui@0.80.6-piclient.7.patch
  '@earendil-works/pi-tui@0.80.6': patches/@earendil-works__pi-tui@0.80.6.patch
  next-themes@0.4.6: patches/next-themes@0.4.6.patch
